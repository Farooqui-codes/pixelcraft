<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>
  (function() {
    try {
      var saved = localStorage.getItem('pixelcraft_theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch(e) {}
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to PixelCraft</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logos/logo-icon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <header class="site-header">
    <div class="container">
      <nav class="navbar" style="justify-content: space-between;">
        <a href="/index.html" class="brand-link">
          <img src="/assets/logos/logo.svg" alt="PixelCraft Logo" class="brand-logo-img">
        </a>
        <button class="btn-icon theme-toggle-btn"><i class="fa-solid fa-sun theme-toggle-icon"></i></button>
      </nav>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <img src="/assets/logos/logo-icon.svg" alt="PixelCraft" style="width: 48px; height: 48px; margin: 0 auto 1rem;">
        <h2>Welcome Back</h2>
        <p style="font-size: 0.9rem; margin-top: 0.35rem;">Log in to access your saved projects and creative tools.</p>
      </div>

      <div id="login-error-alert" style="display: none; padding: 0.75rem 1rem; background: rgba(239, 68, 68, 0.15); border: 1px solid #EF4444; border-radius: var(--radius-sm); color: #EF4444; margin-bottom: 1.25rem; font-size: 0.85rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="login-email" required placeholder="name@company.com" autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" style="margin-bottom: 0;">Password</label>
            <a href="/forgot-password.html" style="font-size: 0.8rem; color: var(--brand-blue);">Forgot?</a>
          </div>
          <div style="position: relative;">
            <input type="password" class="form-control" id="login-password" required placeholder="••••••••" autocomplete="current-password" style="padding-right: 2.75rem;">
            <button type="button" class="btn-icon" id="btn-toggle-login-pass" style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; color: var(--text-muted);" title="Show or hide password">
              <i class="fa-solid fa-eye" id="login-eye-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%; margin-top: 0.5rem;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Log In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
        Don't have an account yet? <a href="/signup.html" style="color: var(--brand-blue); font-weight: 600;">Sign up</a>
      </div>
    </div>
  </main>

  <footer class="site-footer" style="padding: 1.5rem 0; margin-top: 0;">
    <div class="container" style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      &copy; 2026 PixelCraft Technologies Inc. All rights reserved.
    </div>
  </footer>

    <script src="/assets/vendor/gsap/gsap.min.js"></script>
  <script src="/assets/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="/assets/js/gsap-animations.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ux-patterns.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      if (PixelCraftAuth.isLoggedIn()) {
        window.location.href = '/workspace.html';
        return;
      }

      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      const errAlert = document.getElementById('login-error-alert');
      const submitBtn = document.getElementById('login-submit-btn');
      const togglePassBtn = document.getElementById('btn-toggle-login-pass');
      const eyeIcon = document.getElementById('login-eye-icon');

      if (togglePassBtn && passInput) {
        togglePassBtn.onclick = () => {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
          eyeIcon.className = isPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        };
      }

      form.onsubmit = async (e) => {
        e.preventDefault();
        errAlert.style.display = 'none';

        const email = emailInput.value.trim();
        const password = passInput.value;

        if (!email || !password) {
          errAlert.textContent = 'Please enter both your email and password.';
          errAlert.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

        try {
          const res = await PixelCraftAPI.auth.login({ email, password });
          PixelCraftAPI.setToken(res.token);
          PixelCraftAuth.setUser(res.user);
          PixelCraftUX.showToast('Login successful! Redirecting...', 'success');

          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || (res.user.role === 'admin' ? '/admin.html' : '/workspace.html');

          setTimeout(() => {
            window.location.href = redirect;
          }, 600);
        } catch (err) {
          errAlert.textContent = err.message || 'Invalid email or password.';
          errAlert.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Log In';
        }
      };
    });
  </script>
</body>
</html>
