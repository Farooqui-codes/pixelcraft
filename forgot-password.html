<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>
  (function() {
    try {
      var saved = localStorage.getItem('pixelcraft_theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch(e) {}
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — PixelCraft</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logos/logo-icon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <header class="site-header">
    <div class="container">
      <nav class="navbar" style="justify-content: space-between;">
        <a href="/index.html" class="brand-link">
          <img src="/assets/logos/logo.svg" alt="PixelCraft Logo" class="brand-logo-img">
        </a>
        <button class="btn-icon theme-toggle-btn"><i class="fa-solid fa-sun theme-toggle-icon"></i></button>
      </nav>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(53, 185, 255, 0.15); color: var(--brand-blue); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem;">
          <i class="fa-solid fa-key"></i>
        </div>
        <h2>Reset Your Password</h2>
        <p style="font-size: 0.9rem; margin-top: 0.35rem;">Enter your verified account email to initiate a secure password reset.</p>
      </div>

      <div id="reset-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

      <!-- Step 1: Request Email -->
      <form id="forgot-step1-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="reset-email" required placeholder="name@company.com">
        </div>
        <button type="submit" class="btn btn-primary" id="btn-request-reset" style="width: 100%;">
          Send Reset Instructions
        </button>
      </form>

      <!-- Step 2: Set New Password (Revealed when token exists) -->
      <form id="forgot-step2-form" style="display: none;">
        <input type="hidden" id="reset-token-field">
        <div class="form-group">
          <label class="form-label">New Password (Min 6 Characters)</label>
          <input type="password" class="form-control" id="reset-new-password" required minlength="6" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" id="btn-confirm-reset" style="width: 100%;">
          Set New Password
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
        Remembered your password? <a href="/login.html" style="color: var(--brand-blue); font-weight: 600;">Back to login</a>
      </div>
    </div>
  </main>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ux-patterns.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const step1 = document.getElementById('forgot-step1-form');
      const step2 = document.getElementById('forgot-step2-form');
      const emailInput = document.getElementById('reset-email');
      const tokenField = document.getElementById('reset-token-field');
      const newPassInput = document.getElementById('reset-new-password');
      const alertBox = document.getElementById('reset-alert');

      // Check if URL has token
      const urlParams = new URLSearchParams(window.location.search);
      const urlToken = urlParams.get('token');
      if (urlToken) {
        step1.style.display = 'none';
        step2.style.display = 'block';
        tokenField.value = urlToken;
      }

      step1.onsubmit = async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();

        try {
          const res = await PixelCraftAPI.auth.forgotPassword({ email });
          alertBox.style.display = 'block';
          alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
          alertBox.style.color = '#10B981';
          alertBox.style.border = '1px solid #10B981';
          alertBox.textContent = res.message;

          if (res.resetToken) {
            tokenField.value = res.resetToken;
            step1.style.display = 'none';
            step2.style.display = 'block';
          }
        } catch (err) {
          alertBox.style.display = 'block';
          alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
          alertBox.style.color = '#EF4444';
          alertBox.style.border = '1px solid #EF4444';
          alertBox.textContent = err.message;
        }
      };

      step2.onsubmit = async (e) => {
        e.preventDefault();
        const token = tokenField.value;
        const new_password = newPassInput.value;

        try {
          const res = await PixelCraftAPI.auth.resetPassword({ token, new_password });
          PixelCraftUX.showToast(res.message, 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } catch (err) {
          alertBox.style.display = 'block';
          alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
          alertBox.style.color = '#EF4444';
          alertBox.style.border = '1px solid #EF4444';
          alertBox.textContent = err.message;
        }
      };
    });
  </script>
</body>
</html>
