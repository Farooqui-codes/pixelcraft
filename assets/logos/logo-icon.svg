<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="pcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35B9FF" />
      <stop offset="100%" stop-color="#7957FF" />
    </linearGradient>
    <linearGradient id="pcGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7957FF" />
      <stop offset="100%" stop-color="#FF6584" />
    </linearGradient>
    <filter id="pcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield / Tile -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="#101426" stroke="url(#pcGrad1)" stroke-width="2.5" />
  <!-- Isometric Pixel Craft Cubes -->
  <!-- Top Center Cube -->
  <path d="M50 20 L72 32 L50 44 L28 32 Z" fill="url(#pcGrad1)" />
  <path d="M28 32 L50 44 L50 68 L28 56 Z" fill="#7957FF" fill-opacity="0.85" />
  <path d="M50 44 L72 32 L72 56 L50 68 Z" fill="#35B9FF" fill-opacity="0.9" />
  
  <!-- Floating Accent Pixel -->
  <path d="M50 50 L64 58 L50 66 L36 58 Z" fill="#FFFFFF" fill-opacity="0.95" />
  <path d="M36 58 L50 66 L50 78 L36 70 Z" fill="#FF6584" />
  <path d="M50 66 L64 58 L64 70 L50 78 Z" fill="#35B9FF" />
  
  <!-- Subtle Sparkle -->
  <circle cx="75" cy="25" r="3" fill="#35B9FF" filter="url(#pcGlow)" />
  <circle cx="25" cy="72" r="2.5" fill="#FF6584" filter="url(#pcGlow)" />
</svg>

