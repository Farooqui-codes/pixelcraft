<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35B9FF" />
      <stop offset="100%" stop-color="#7957FF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(6, 6) scale(0.52)">
    <rect x="8" y="8" width="84" height="84" rx="22" fill="#101426" stroke="url(#logoGrad)" stroke-width="3" />
    <!-- Isometric Pixel Craft Cubes -->
    <path d="M50 20 L72 32 L50 44 L28 32 Z" fill="url(#logoGrad)" />
    <path d="M28 32 L50 44 L50 68 L28 56 Z" fill="#7957FF" fill-opacity="0.9" />
    <path d="M50 44 L72 32 L72 56 L50 68 Z" fill="#35B9FF" fill-opacity="0.95" />
    <!-- Floating Accent Pixel -->
    <path d="M50 50 L64 58 L50 66 L36 58 Z" fill="#FFFFFF" />
    <path d="M36 58 L50 66 L50 78 L36 70 Z" fill="#FF6584" />
    <path d="M50 66 L64 58 L64 70 L50 78 Z" fill="#35B9FF" />
    <circle cx="75" cy="25" r="3.5" fill="#35B9FF" filter="url(#logoGlow)" />
  </g>

  <!-- Typography -->
  <text x="68" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" fill="currentColor" letter-spacing="-0.5">Pixel<tspan fill="#35B9FF">Craft</tspan></text>
  <text x="69" y="52" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="1.5">CREATE • CONVERT • DESIGN • SIMPLIFY</text>
</svg>

