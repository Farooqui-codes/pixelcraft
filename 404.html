<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>
  (function() {
    try {
      var saved = localStorage.getItem('pixelcraft_theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch(e) {}
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | PixelCraft</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logos/logo-icon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- SITE HEADER -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar" style="justify-content: space-between;">
        <a href="/index.html" class="brand-link">
          <img src="/assets/logos/logo.svg" alt="PixelCraft Logo" class="brand-logo-img">
        </a>
        <button class="btn-icon theme-toggle-btn"><i class="fa-solid fa-sun theme-toggle-icon"></i></button>
      </nav>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem; text-align: center;">
    <div style="max-width: 620px; width: 100%;">
      <div style="font-size: 6rem; font-weight: 800; line-height: 1; margin-bottom: 1rem;" class="text-gradient">
        404
      </div>
      <h1 style="font-size: 2.2rem; margin-bottom: 0.75rem;">Page Not Found</h1>
      <p style="font-size: 1.05rem; color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6;">
        The page, tool, or document you're searching for might have been renamed, moved, or never existed in the matrix.
      </p>

      <!-- 404 SEARCH BAR -->
      <form action="/tools.html" method="GET" style="position: relative; max-width: 480px; margin: 0 auto 2rem;" onsubmit="if(!this.q.value.trim()){event.preventDefault(); window.PixelCraftPalette && window.PixelCraftPalette.open();}">
        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        <input type="text" name="q" class="form-control" placeholder="Search 30 tools or press Ctrl+K..." style="padding-left: 2.8rem; height: 48px; border-radius: var(--radius-full);">
      </form>

      <!-- POPULAR TOOL SHORTCUTS -->
      <div style="margin-bottom: 2.5rem;">
        <span style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; display: block; margin-bottom: 0.75rem;">Popular Tool Shortcuts</span>
        <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
          <a href="/tool.html?id=image-compressor" class="btn btn-secondary btn-sm" style="border-radius: var(--radius-full);"><i class="fa-solid fa-file-image" style="color: var(--accent-image);"></i> Compressor</a>
          <a href="/tool.html?id=pdf-merger" class="btn btn-secondary btn-sm" style="border-radius: var(--radius-full);"><i class="fa-solid fa-file-pdf" style="color: var(--accent-pdf);"></i> PDF Merger</a>
          <a href="/tool.html?id=instagram-post-maker" class="btn btn-secondary btn-sm" style="border-radius: var(--radius-full);"><i class="fa-solid fa-wand-magic-sparkles" style="color: var(--accent-creator);"></i> Instagram Post</a>
          <a href="/tool.html?id=invoice-generator" class="btn btn-secondary btn-sm" style="border-radius: var(--radius-full);"><i class="fa-solid fa-file-invoice-dollar" style="color: var(--accent-business);"></i> Invoices</a>
          <a href="/tool.html?id=url-qr-generator" class="btn btn-secondary btn-sm" style="border-radius: var(--radius-full);"><i class="fa-solid fa-qrcode" style="color: var(--accent-qr);"></i> QR Codes</a>
        </div>
      </div>

      <!-- ACTION BUTTONS -->
      <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="/index.html" class="btn btn-primary btn-lg btn-shine"><i class="fa-solid fa-house"></i> Take Me Home</a>
        <a href="/tools.html" class="btn btn-secondary btn-lg"><i class="fa-solid fa-toolbox"></i> Explore 30 Tools</a>
      </div>
    </div>
  </main>

  <footer class="site-footer" style="padding: 1.5rem 0; margin-top: 0;">
    <div class="container" style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      &copy; 2026 PixelCraft Technologies Inc. All rights reserved.
    </div>
  </footer>

    <script src="/assets/vendor/gsap/gsap.min.js"></script>
  <script src="/assets/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="/assets/js/gsap-animations.js"></script>
  <script src="/assets/js/theme.js"></script>
</body>
</html>
